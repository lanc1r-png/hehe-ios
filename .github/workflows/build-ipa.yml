name: Build unsigned IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add app icon
        run: |
          if [ -f icon-1024.png ]; then
            D=Hehe/Assets.xcassets/AppIcon.appiconset
            mkdir -p "$D"
            cp icon-1024.png "$D/icon-1024.png"
            printf '%s' '{"info":{"author":"xcode","version":1}}' > Hehe/Assets.xcassets/Contents.json
            printf '%s' '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$D/Contents.json"
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (no signing)
        run: |
          xcodebuild -project Hehe.xcodeproj -scheme Hehe \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Enable background audio (needed for Picture in Picture)
        run: |
          PL=build/Build/Products/Release-iphoneos/Hehe.app/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PL"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PL"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PL"
      - name: Expose app folder in Files (file sharing)
        run: |
          PL=build/Build/Products/Release-iphoneos/Hehe.app/Info.plist
          for K in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace; do
            /usr/libexec/PlistBuddy -c "Delete :$K" "$PL" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$K bool true" "$PL"
          done
          /usr/libexec/PlistBuddy -c "Print :UIFileSharingEnabled" "$PL"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsOpeningDocumentsInPlace" "$PL"
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Hehe.app Payload/
          zip -r Hehe.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Hehe-unsigned-ipa
          path: Hehe.ipa
